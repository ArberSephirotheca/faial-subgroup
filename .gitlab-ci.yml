---
stages:
- validate
- build
- test
- deploy
- containerize

image: registry.gitlab.com/umb-svl/faial/faial:ci

.cache: &global_cache
  before_script:
    - export PATH="$PATH:$CI_PROJECT_DIR"

  cache:
    key: "Ubuntu-$CI_COMMIT_REF_NAME-2"
    paths:
    - _build

check-opam-consistency:
  stage: validate
  <<: *global_cache
  script:
    - cd "$CI_PROJECT_DIR"
    - eval $(opam config env)
    - cp faial.opam faial.opam.backup
    - dune build faial.opam
    - |
      diff faial.opam.backup faial.opam || (
        echo "ERROR: Generated faial.opam differs from committed version. Run 'dune build faial.opam' and commit the changes."
        exit 1
      )
    - echo "✅ faial.opam is consistent with dune-project"

test:
  stage: test
  <<: *global_cache
  script:
    - cd "$CI_PROJECT_DIR"
    - rm -f ./target/*/faial
    - eval $(opam config env)
    - ocamlc --version
    - export PATH="$PWD:$PATH"
    - make
    - make test

build-dist:
  stage: build
  <<: *global_cache
  script:
    - cd "$CI_PROJECT_DIR"
    - whoami
    - pwd
    - ls -l
    - rm -f ./target/*/faial
    - eval $(opam config env)
    - ocamlc --version
    - dune build --release
    - cp -Lr _build/install/default/bin/* ./

  artifacts:
    paths:
      - c-ast
      - wgsl-ast
      - faial-drf
      - faial-bc
      - faial-cost-dyn
      - faial-cost
      - README.md
      - LICENSE

bundle-lin:
  stage: deploy
  dependencies:
    - build-dist
  only:
    # Only add branches that also exist in c-to-json and faial-infer!
    # Otherwise, this will fail as wget will not find their job artifacts.
    - main
  script:
    - cd $CI_PROJECT_DIR
    - mkdir bundle
    - cd bundle
    - ../scripts/ci.sh

  artifacts:
    paths:
      - bundle/faial.tar.bz2

build-container:
  stage: containerize
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  dependencies:
    - bundle-lin
  only:
    - main
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    CONTAINER_IMAGE: $CI_REGISTRY_IMAGE/faial-tools
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -f docker/tools.Dockerfile -t $CONTAINER_IMAGE:$CI_COMMIT_SHA .
    - docker build -f docker/tools.Dockerfile -t $CONTAINER_IMAGE:latest .
    - echo "Testing container with tutorial/saxpy.cu"
    - docker run --rm -v $CI_PROJECT_DIR:/workspace $CONTAINER_IMAGE:latest faial-drf tutorial/saxpy.cu
    - docker push $CONTAINER_IMAGE:$CI_COMMIT_SHA
    - docker push $CONTAINER_IMAGE:latest
  after_script:
    - docker logout $CI_REGISTRY


bundle-mac:
  when: manual
  stage: deploy
  image: macos-14-xcode-15
  variables:
    OCAML_VERSION: 5.2.0
    HOMEBREW_NO_INSTALL_CLEANUP: 1
    HOMEBREW_NO_AUTO_UPDATE: 1
  tags:
    - saas-macos-medium-m1
  script:
    - cd "$CI_PROJECT_DIR"
    - brew install opam python@3.9
    - >
      if [ ! -d ~/.opam ]; then
        echo "Initializing OPAM"
        opam init --bare --disable-sandboxing &&
        opam switch create main ${OCAML_VERSION}
      fi
    - eval $(opam env --switch=main)
    - ./configure.sh -y --confirm-level=unsafe-yes
    - ocamlc --version
    - make
    - mkdir bundle
    - cd bundle
    - ../scripts/ci.sh
  artifacts:
    paths:
      - bundle/faial.tar.bz2
